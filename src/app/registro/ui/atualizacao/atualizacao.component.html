<div fxLayout="row" fxLayoutAlign="center">
  <div fxLayout="column" fxFlex="100%">
    <mat-card >
      <mat-card-header>
        <mat-card-title>
          <h2>Atualizar registros - {{ data.dia }}</h2>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content class="mat-20">
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
          <div fxLayout="column" fxFlex="100%">
            <table class="mat-elevation-z1">
              <thead>
              <tr>
                <th>Posição</th>
                <th>Sentido</th>
                <th>Hora</th>
                <th>Ações</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let reg of registros; index as i">
                <td>{{ i + 1 }}</td>
                <td>
                  <mat-form-field appearance="fill">
                    <mat-select [(ngModel)]="reg.sentido">
                      <mat-option value="Entrada">Entrada</mat-option>
                      <mat-option value="Saída">Saída</mat-option>
                    </mat-select>
                  </mat-form-field>
                </td>
                <td>
                  <mat-form-field appearance="fill">
                    <input matInput [(ngModel)]="reg.hora" placeholder="HH:mm:ss" pattern="([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])">
                  </mat-form-field>
                </td>
                <td>
                  <button mat-icon-button color="primary" (click)="moveUp(i)" [disabled]="i === 0">
                    <mat-icon>arrow_upward</mat-icon>
                  </button>
                  <button mat-icon-button color="primary" (click)="moveDown(i)" [disabled]="i === registros.length - 1">
                    <mat-icon>arrow_downward</mat-icon>
                  </button>
                  <button mat-icon-button color="warn" (click)="remove(i)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px" class="mt-20">
          <div fxLayout="column">
            <button mat-flat-button (click)="cancel()" color="accent" >Cancelar</button>
          </div>
          <div fxLayout="column">
            <button mat-flat-button color="primary" (click)="save()">Salvar</button>
          </div>
          <div fxLayout="column">
            <button mat-stroked-button color="primary" (click)="add()">Adicionar</button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="login-container">
  <mat-card>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-card-header>
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="fill">
          <mat-label>Matrícula</mat-label>
          <input matInput formControlName="matricula" />
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Grupos</mat-label>
          <mat-select formControlName="authorities" multiple>
            <mat-option *ngFor="let group of grupos" [value]="group">{{ group }}</mat-option>
          </mat-select>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Entrar</button>
      </mat-card-actions>
    </form>
  </mat-card>

  <button mat-raised-button color="primary" (click)="login()" >Login</button>
</div>

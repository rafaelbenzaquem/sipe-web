<div fxLayout="row" fxLayoutAlign="center">
  <div fxLayout="column" fxFlex="80%">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>
          Usuário: {{ usuario.nome }} , matrícula: {{ usuario.matricula }}
        </mat-card-title>
      </mat-card-header>
      <mat-card-content class="mat-20">
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
          <div fxLayout="column">
            <mat-form-field class="example-form-field">
              <mat-label>Defina um período</mat-label>
              <mat-date-range-input [formGroup]="periodo" [rangePicker]="rangePicker">
                <input matStartDate
                       formControlName="inicio"
                       placeholder="Data inicial"/>
                <input matEndDate
                       formControlName="fim"
                       placeholder="Data final"/>
              </mat-date-range-input>
              <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
              <mat-date-range-picker #rangePicker>
                <mat-date-range-picker-actions>
                  <button mat-button
                          matDateRangePickerCancel>
                    Cancelar
                  </button>
                  <button mat-raised-button
                          (click)="definePeriodo()"
                          matDateRangePickerApply>
                    Definir
                  </button>
                </mat-date-range-picker-actions>
              </mat-date-range-picker>
            </mat-form-field>
          </div>
        </div>
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
          <div fxLayout="column">
            <button mat-raised-button
                    [disabled]="!periodo.value.inicio||!periodo.value.fim"
                    (click)="buscaPontos()"
            >
              Buscar Pontos
            </button>
          </div>
          <div fxLayout="column">
            <button mat-raised-button
                    [disabled]="!periodo.value.inicio||!periodo.value.fim|| pontos.length === 0||!foiBuscado"
                    (click)="baixarRelatorio()">
              Download Relatório
            </button>
          </div>
          <div fxLayout="column">
            <button mat-raised-button
                    [disabled]="!periodo.value.inicio||!periodo.value.fim||!foiBuscado"
                    (click)="atualizaPontos()">
              Atualizar registros
            </button>
          </div>
        </div>
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
          <div fxLayout="column" fxFlex="100%" class="mt-20">
            <mat-progress-bar
              *ngIf="isLoading"
              mode="indeterminate"
              color="primary">
            </mat-progress-bar>
          </div>
        </div>
        <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
          <div fxLayout="column" fxFlex="100%" class="mt-20">
            @if (foiBuscado) {
              {{ exibirPeriodo() }} <br/>
            }
            @if (pontos.length !== 0) {
              <app-tabela-pontos
                [pontos]="pontos"
                [tamanhoRegistros]="verificaMaiorListaDeRegistro(pontos)"
                (editar)="openAtualizacao($event)">
              </app-tabela-pontos>
            }
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="login-container">
  <mat-card appearance="outlined" *ngIf="!isLoggedIn()">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
    </mat-card-content>
    <mat-card-actions>
      <button matButton="filled"  (click)="login()">Entrar</button>
    </mat-card-actions>
  </mat-card>
</div>

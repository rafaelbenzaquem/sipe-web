<table mat-table [dataSource]="pontosTableModel" multiTemplateDataRows>

  <!-- Dia -->
  <ng-container matColumnDef="dia">
    <th mat-header-cell *matHeaderCellDef style="text-align: center;">Dia</th>
    <td mat-cell *matCellDef="let pontoTableModel" style="text-align: center;">
      {{ pontoTableModel.dia }}
    </td>
  </ng-container>

  <!-- Registros -->
  <ng-container *ngFor="let index of getRegistroIndices()" [matColumnDef]="'registro' + index">
    <th mat-header-cell *matHeaderCellDef style="text-align: center;">
      {{ index + 1 }}° Registro
    </th>
    <td mat-cell *matCellDef="let pontoTableModel" style="text-align: center;">
      <app-timer [registro]="pontoTableModel.registros[index]"/>
    </td>
  </ng-container>

  <!-- Total -->
  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef style="text-align: center;">Total</th>
    <td mat-cell *matCellDef="let pontoTableModel" style="text-align: center;">
      {{ pontoTableModel.total }}
    </td>
  </ng-container>

  <!-- Descrição -->
  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef style="text-align: center;">Descrição</th>
    <td mat-cell *matCellDef="let pontoTableModel" style="text-align: center;">
      {{ pontoTableModel.descricao }}
    </td>
  </ng-container>
  <!-- Ações -->
  <ng-container matColumnDef="acoes">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let pontoTableModel" style="text-align: center;">
      <button mat-button (click)="editar.emit(pontoTableModel.ponto)">
        <mat-icon>edit</mat-icon>
        Editar
      </button>
      @if(pontoTableModel.ponto.pedidoAlteracaoPendente && hasAnyRole(['GRP_SIPE_ADMIN','GRP_SIPE_DIRETOR'])){
      <button mat-button color="primary" (click)="aprovar.emit(pontoTableModel.ponto)">
        <mat-icon>thumb_up</mat-icon>
        Aprovar
      </button>
      }
    </td>
  </ng-container>

  <!-- Render headers and rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns;"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
